
services:
  noteme:
    build:
      context: ./noteme-react
      dockerfile: Dockerfile
    image: gaurang1817/noteme-app:v2


  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    container_name: noteme-nginx-exporter
    command:
      - "--nginx.scrape-uri=http://noteme/stub_status"
    depends_on:
      - noteme
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: noteme-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - nginx-exporter
    restart: unless-stopped

  
  grafana:
    image: grafana/grafana:12.1.0
    container_name: noteme-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/noteme-dashboard.json
    volumes:
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/noteme-dashboard.json:/var/lib/grafana/dashboards/noteme-dashboard.json:ro
    depends_on:
      - prometheus
    restart: unless-stopped


name: CI

on:
  push:
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Given to you. Do not delete this job.
  # ---------------------------------------------------------------------------
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run hygiene checks
        run: bash scripts/hygiene.sh

  # ---------------------------------------------------------------------------
  # M3 — Build and automated tests
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Check Python version
        run: python --version
            
      - run: make install
      - run: make test
      - run: make build

  # ---------------------------------------------------------------------------
  # M5 — Containerization: Build and publish Docker image
  # ---------------------------------------------------------------------------
  docker:
    name: Build and push image
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push React image
        uses: docker/build-push-action@v6
        with:
          context: ./noteme-react
          file: ./noteme-react/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  # ---------------------------------------------------------------------------
  # M5 — Deployment. Add a deploy job here.
  # ---------------------------------------------------------------------------

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteME - Login</title>
    <link rel="stylesheet" href="Sign.css">
</head>
<body>
    <div class="left">
        <div class="signin">
            <h1 class="sign">Login Here</h1>
            <h4 style="text-align: center; font-weight: 100;">Welcome back! Please login to your account.</h4>
            <br>
            <form class="loginform" onsubmit="return submitlogin()">
                <input type="email" id="email" placeholder="Enter E-mail" required>
                <input type="password" id="password" placeholder="Enter Password" minlength="8" required>
                <button class="signbutton" type="submit"> Login </button>
            </form>
            <h5 style="text-align: center; font-weight: 100;">
                Not registered yet?
                <a href="Sign.html">Signup Here</a>
            </h5>
        </div>
    </div>
    <div class="right">
        <div class="logo">
            <img src="logo1.png" class="photo" alt="NoteME Logo">
        </div>
        <h1 class="heading">NoteME</h1>
    </div>
    <script src="./login.js"></script>
</body>

</html>

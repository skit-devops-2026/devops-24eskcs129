
apiVersion: apps/v1
kind: Deployment
metadata:
  name: noteme-deployment
  labels:
    app: noteme
spec:
  replicas: 1
  selector:
    matchLabels:
      app: noteme
  template:
    metadata:
      labels:
        app: noteme
    spec:
      containers:
        - name: noteme
          image: gaurang1817/noteme-app:v2
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
